[package]
org = "ores-wasm-loaders"
name = "owl-docs"
version = "0.1.0"
kind = "docs"
language = "docs"
description = "ORES Wasm Loaders: the org's documentation"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/ores-wasm-loaders/owl-docs"

[dependencies]


[build]
command = "node --test test/*.test.mjs"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".vendor/**", ".zed/**", ".zed-pack/**", "tmp/**", "**/*.log", ".DS_Store", "**/target/**", "**/node_modules/**", "**/dist/**"]

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."



[scripts]
test = "node --test test/*.test.mjs"
